version: '3.8'

services:
  # FastAPI Application
  api:
    build: .
    container_name: loadforecast_api
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./models:/app/models
      - ./data:/app/data
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/loadforecast
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - loadforecast_network

  # TimescaleDB (PostgreSQL with time-series extension)
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: loadforecast_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=loadforecast
    volumes:
      - timescale_data:/var/lib/postgresql/data
    networks:
      - loadforecast_network

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    container_name: loadforecast_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - loadforecast_network

volumes:
  timescale_data:
  redis_data:

networks:
  loadforecast_network:
    driver: bridge
